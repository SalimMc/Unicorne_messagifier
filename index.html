<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorne Messagifier</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>">
<script>
  // apply the saved theme before first paint to avoid a flash
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>🦄 Unicorne Messagifier ✨</h1>
      <p class="sub">Paste a message (plain text or markdown) ➜ get a version full of emojis and kaomojis (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</p>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">🌙</button>
  </header>

  <div class="toolbar">
    <select id="lang" aria-label="Language">
      <option value="auto">🌍 Language: auto</option>
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="cs">🇨🇿 Čeština</option>
      <option value="ar">🇸🇦 العربية</option>
    </select>
    <button class="btn" id="reroll" type="button" title="Get another random version">🎲 Another version</button>
  </div>

  <div class="grid">
    <section class="box">
      <div class="box-head"><label for="in">Your message</label></div>
      <textarea id="in" dir="auto" placeholder="Hi! I finally finished my project, I'm so happy!!!"></textarea>
    </section>

    <button class="go" id="go" type="button" title="Messagify (Ctrl+Enter)" aria-label="Messagify">➜</button>

    <section class="box">
      <div class="box-head">
        <label for="out">Result <span class="tag" id="info"></span></label>
        <div class="levels" role="radiogroup" aria-label="Intensity">
          <label><input type="radio" name="level" value="1"><span>(˘ω˘) Subtle</span></label>
          <label><input type="radio" name="level" value="2" checked><span>(＾▽＾) Normal</span></label>
          <label><input type="radio" name="level" value="3"><span>┻━┻ Chaos</span></label>
        </div>
      </div>
      <div class="out-wrap">
        <textarea id="out" dir="auto" readonly placeholder="(｡･ω･｡) ..."></textarea>
        <button class="icon-btn copy" id="copy" type="button" aria-label="Copy result" title="Copy result">📋</button>
      </div>
    </section>
  </div>

  <footer>
    Runs 100% in your browser, nothing is sent anywhere. Emojis: <a href="https://cldr.unicode.org/">Unicode CLDR</a> ·
    Emotions: <a href="https://saifmohammad.com/WebPages/NRC-Emotion-Lexicon.htm">NRC Emotion Lexicon</a> (non-commercial use).
  </footer>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
