<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorne Messagifier</title>
<meta name="description" content="Turn plain text or markdown into a version full of emojis and kaomojis.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>">
<script>
  // resolve the theme before first paint (saved choice, else system preference)
  (() => {
    let theme = null;
    try { theme = localStorage.getItem("theme"); } catch {}
    document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="nav">
  <a class="brand" href="./"><span class="brand-logo">🦄</span><span>Unicorne <b>Messagifier</b></span></a>
  <p class="tagline">Make your messages <span class="grad">sparkle</span> with emojis and kaomojis <span class="kao">(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</span></p>
  <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <section class="card">
    <div class="toolbar">
      <label class="select">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <select id="lang" aria-label="Language">
          <option value="auto">Auto-detect language</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="cs">Čeština</option>
          <option value="ar">العربية</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <button class="btn" id="reroll" type="button" title="Get another random version">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" class="dot"/><circle cx="15.5" cy="15.5" r="1.2" class="dot"/><circle cx="12" cy="12" r="1.2" class="dot"/></svg>
        Another version
      </button>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="in">Your message</label>
          <span class="meta" id="count">0 chars</span>
        </div>
        <textarea id="in" dir="auto" spellcheck="false" placeholder="Hi! I finally finished my project, I'm so happy!!!"></textarea>
      </div>

      <button class="go" id="go" type="button" title="Messagify (Ctrl+Enter)" aria-label="Messagify">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="pane">
        <div class="pane-head">
          <label for="out">Result <span class="meta" id="info"></span></label>
          <div class="levels" role="radiogroup" aria-label="Intensity">
            <label><input type="radio" name="level" value="1"><span>Subtle</span></label>
            <label><input type="radio" name="level" value="2" checked><span>Normal</span></label>
            <label><input type="radio" name="level" value="3"><span>Chaos</span></label>
          </div>
          <button class="icon-btn sm" id="copy" type="button" aria-label="Copy result" title="Copy result">
            <svg class="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
            <svg class="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
          </button>
        </div>
        <textarea id="out" dir="auto" readonly placeholder="(｡･ω･｡) your sparkly message shows up here"></textarea>
      </div>
    </div>
  </section>

  <footer>
    Runs entirely in your browser, nothing is sent anywhere ·
    Emojis from <a href="https://cldr.unicode.org/">Unicode CLDR</a> ·
    Emotions from the <a href="https://saifmohammad.com/WebPages/NRC-Emotion-Lexicon.htm">NRC Emotion Lexicon</a> (non-commercial use)
  </footer>
</main>
<script type="module" src="src/app.js?v=7"></script>
</body>
</html>
